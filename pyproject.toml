[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nextcloudfetch"
version = "0.3.0"
description = "Nextcloud file or folder fetcher/downloader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johnson Wang", email = "a0903809066@gmail.com" },
]
dependencies = [
    "httpx",
    "nextcloud-api-wrapper",
    "python-dotenv",
    "tqdm",
    "typer",
]

[project.scripts]
ncfetch = "ncfetch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ncfetch"]

[tool.typer]
colored = true

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"